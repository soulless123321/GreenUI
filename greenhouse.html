<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Теплица — интерфейс</title>
    <style>
        :root {
            --app-width: 320px;
            --app-height: 505px;
            --glass-bg: rgba(20, 20, 20, 0.55);
            --glass-blur: blur(16px);
            --active-green: rgba(76, 175, 80, 0.4);
            --nav-height: 62px;
        }

        /* ---------- Сброс и центровка ---------- */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #2c2c2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .app-container {
            width: var(--app-width);
            height: var(--app-height);
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            position: relative;
        }

        .content-area {
            width: 100%; height: 100%;
            position: relative;
        }

        .tab-content {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .tab-content.active { display: block; }

        .scene {
            width: 100%; height: 100%;
            background-image: url('greenhouse.svg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* ---------- Горячие точки (отладка) ---------- */
        .hotspot {
            position: absolute;
            background: rgba(255, 255, 0, 0.25);
            border: 2px dashed #ff6600;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px;
            text-shadow: 1px 1px 2px black;
        }

        /* ========== КНОПКИ УПРАВЛЕНИЯ (над панелью) ========== */
        .control-buttons {
            position: absolute;
            bottom: 88px;                   /* отступ над нижней панелью */
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: center;
            gap: 24px;
            z-index: 15;
        }
        .ctrl-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .ctrl-btn:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.2);
        }
        .ctrl-btn img {
            width: 26px; height: 26px;
            filter: drop-shadow(0 1px 2px black);
        }

        /* ========== НИЖНЯЯ ПЛАВАЮЩАЯ ПАНЕЛЬ ========== */
        .bottom-nav {
            position: absolute;
            bottom: 14px;
            left: 12px;
            right: 12px;
            height: var(--nav-height);
            background: rgba(10, 10, 10, 0.45);    /* более прозрачная */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 34px;                   /* сильно круглая */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px;
            z-index: 10;
        }

        .nav-btn {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ddd;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            border-radius: 24px;
            margin: 0 2px;
            position: relative;
        }
        .nav-btn img {
            width: 24px; height: 24px;
            margin-bottom: 3px;
            opacity: 0.85;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
        }

        /* Зелёная подсветка активной кнопки */
        .nav-btn.active {
            background: var(--active-green);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 0 14px rgba(76, 175, 80, 0.5);
            backdrop-filter: blur(8px);
        }
        .nav-btn.active img {
            opacity: 1;
            filter: drop-shadow(0 0 4px rgba(76,175,80,0.7));
        }

        /* ========== БУРГЕР-МЕНЮ (правая сторона) ========== */
        .burger-btn {
            position: absolute;
            top: 10px; right: 16px;
            z-index: 20;
            width: 40px; height: 40px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            transition: background 0.2s;
        }
        .burger-btn:hover { background: rgba(0,0,0,0.7); }

        .side-panel {
            position: absolute;
            top: 0; right: -280px;
            width: 250px; height: 100%;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255,255,255,0.1);
            z-index: 25;
            transition: right 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
            color: white;
            display: flex;
            flex-direction: column;
        }
        .side-panel.open { right: 0; }
        .side-panel h4 {
            margin-top: 0; margin-bottom: 24px;
            font-weight: 500; font-size: 18px;
            color: #ddd;
        }
        .side-panel label {
            font-size: 14px; color: #aaa;
            margin-bottom: 8px;
        }
        .side-panel input {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            background: #333;
            border: 1px solid #555;
            border-radius: 6px;
            color: white;
            outline: none;
        }
        .side-panel .close-btn {
            align-self: flex-end;
            background: transparent; border: none;
            color: white; font-size: 24px;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- ========== Кнопка-бургер (теперь справа) ========== -->
        <div class="burger-btn" id="burgerBtn">☰</div>

        <!-- ========== Боковая панель настроек (выезжает справа) ========== -->
        <div class="side-panel" id="sidePanel">
            <button class="close-btn" id="closePanelBtn">&times;</button>
            <h4>Настройки экрана</h4>
            <label>Единицы температуры</label>
            <input type="text" placeholder="°C">
            <label>Частота обновления</label>
            <input type="text" placeholder="5 сек">
            <label>Тема</label>
            <input type="text" placeholder="Светлая">
        </div>

        <!-- ========== Область контента (вкладки) ========== -->
        <div class="content-area">
            <!-- Главная -->
            <div id="tab-home" class="tab-content active">
                <div class="scene">
                    <!-- Горячие точки (пока видны) -->
                    <div id="tempSensor" class="hotspot" style="left: 15%; top: 25%; width: 60px; height: 60px;">🌡️</div>
                    <div id="pumpControl" class="hotspot" style="left: 70%; top: 60%; width: 70px; height: 70px;">💧</div>
                </div>
            </div>

            <!-- Управление -->
            <div id="tab-control" class="tab-content">
                <div style="padding: 20px; color: #333;">
                    <h3>Управление</h3>
                    <p>Здесь будут кнопки управления насосом, светом и пр.</p>
                </div>
            </div>

            <!-- Графики -->
            <div id="tab-charts" class="tab-content">
                <div style="padding: 20px; color: #333;">
                    <h3>Графики</h3>
                    <p>Графики температуры и влажности.</p>
                </div>
            </div>

            <!-- Настройки -->
            <div id="tab-settings" class="tab-content">
                <div style="padding: 20px; color: #333;">
                    <h3>Настройки</h3>
                    <p>Общие настройки теплицы.</p>
                </div>
            </div>
        </div>

        <!-- ========== Нижняя плавающая панель ========== -->
        <div class="bottom-nav">
            <div class="nav-btn active" data-tab="home">
                <span class="icon">🏠</span>
                <span>Главная</span>
            </div>
            <div class="nav-btn" data-tab="control">
                <span class="icon">🎛️</span>
                <span>Управление</span>
            </div>
            <div class="nav-btn" data-tab="charts">
                <span class="icon">📊</span>
                <span>Графики</span>
            </div>
            <div class="nav-btn" data-tab="settings">
                <span class="icon">⚙️</span>
                <span>Настройки</span>
            </div>
        </div>
    </div>

    <!-- Временный JavaScript для демонстрации навигации и бургера -->
    <script>
        (function() {
            // --- Переключение вкладок ---
            var navButtons = document.querySelectorAll('.nav-btn');
            var tabs = document.querySelectorAll('.tab-content');

            navButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    navButtons.forEach(function(b) { b.classList.remove('active'); });
                    tabs.forEach(function(t) { t.classList.remove('active'); });

                    var targetId = this.getAttribute('data-tab');
                    var targetTab = document.getElementById('tab-' + targetId);
                    if (targetTab) {
                        targetTab.classList.add('active');
                        this.classList.add('active');
                    }
                });
            });

            // --- Бургер-меню (правая сторона) ---
            var burgerBtn = document.getElementById('burgerBtn');
            var sidePanel = document.getElementById('sidePanel');
            var closePanelBtn = document.getElementById('closePanelBtn');

            burgerBtn.addEventListener('click', function() {
                sidePanel.classList.add('open');
            });
            closePanelBtn.addEventListener('click', function() {
                sidePanel.classList.remove('open');
            });
            // Закрытие при клике вне панели
            document.addEventListener('click', function(e) {
                if (!sidePanel.contains(e.target) && e.target !== burgerBtn) {
                    sidePanel.classList.remove('open');
                }
            });
        })();
    </script>
</body>
