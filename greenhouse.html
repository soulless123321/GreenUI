<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Теплица — интерфейс</title>
    <style>
        :root {
            --app-width: 320px;
            --app-height: 505px;
            --glass-bg: rgba(20, 20, 20, 0.55);
            --glass-blur: blur(16px);
            --active-green: rgba(76, 175, 80, 0.4);
            --nav-height: 62px;
        }

        /* ---------- Сброс и центровка ---------- */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #2c2c2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .app-container {
            width: var(--app-width);
            height: var(--app-height);
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            position: relative;
        }

        .content-area {
            width: 100%; height: 100%;
            position: relative;
        }

        .tab-content {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .tab-content.active { display: block; }

        .scene {
            width: 100%; height: 100%;
            background-image: url('greenhouse.svg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* ---------- Горячие точки (отладка) ---------- */
        .hotspot {
            position: absolute;
            background: rgba(255, 255, 0, 0.25);
            border: 2px dashed #ff6600;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px;
            text-shadow: 1px 1px 2px black;
        }

        /* ========== КНОПКИ УПРАВЛЕНИЯ (над панелью) ========== */
        .control-buttons {
            position: absolute;
            bottom: 70px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: center;
            gap: 24px;
            z-index: 15;
        }
        .ctrl-btn {
            width: 36px; height: 36px;          /* было 48×48 */
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .ctrl-btn:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.2);
        }
        .ctrl-btn img {
            width: 20px; height: 20px;          /* было 26×26 */
            filter: drop-shadow(0 1px 2px black);
        }

        /* ========== НИЖНЯЯ ПЛАВАЮЩАЯ ПАНЕЛЬ ========== */
        .bottom-nav {
            position: absolute;
            bottom: 14px;
            left: 12px;
            right: 12px;
            height: var(--nav-height);
            background: transparent;                /* полностью прозрачный фон */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.5);   /* выраженная светлая граница */
            border-radius: 34px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px;
            z-index: 10;
        }

        .nav-btn {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ddd;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            border-radius: 20px;          /* чуть уменьшим для симметрии */
            margin: 6px 2px;              /* отступы внутри панели */
            position: relative;
        }
        .nav-btn img {
            width: 24px; height: 24px;
            margin-bottom: 3px;
            opacity: 0.85;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
        }

        .nav-btn.active {
            background: var(--active-green);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 0 14px rgba(76, 175, 80, 0.5);
            backdrop-filter: blur(8px);
            margin: 6px 2px;             /* сохраняем те же отступы, чтобы не дёргалось */
            border-radius: 20px;
        }
        .nav-btn.active img {
            opacity: 1;
            filter: drop-shadow(0 0 4px rgba(76,175,80,0.7));
        }

        /* ========== БУРГЕР-МЕНЮ (правая сторона) ========== */
        .burger-btn {
            position: absolute;
            top: 5px; right: 8px;
            z-index: 20;
            width: 40px; height: 40px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            transition: background 0.2s;
        }
        .burger-btn:hover { background: rgba(0,0,0,0.7); }

        .side-panel {
            position: absolute;
            top: 0; right: -280px;
            width: 250px; height: 100%;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255,255,255,0.1);
            z-index: 25;
            transition: right 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
            color: white;
            display: flex;
            flex-direction: column;
        }
        .side-panel.open { right: 0; }
        .side-panel h4 {
            margin-top: 0; margin-bottom: 24px;
            font-weight: 500; font-size: 18px;
            color: #ddd;
        }
        .side-panel label {
            font-size: 14px; color: #aaa;
            margin-bottom: 8px;
        }
        .side-panel input {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            background: #333;
            border: 1px solid #555;
            border-radius: 6px;
            color: white;
            outline: none;
        }
        .side-panel .close-btn {
            align-self: flex-end;
            background: transparent; border: none;
            color: white; font-size: 24px;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Кнопка-бургер -->
        <div class="burger-btn" id="burgerBtn">☰</div>

        <!-- Боковая панель настроек -->
        <div class="side-panel" id="sidePanel">
            <button class="close-btn" id="closePanelBtn">&times;</button>
            <h4>Настройки экрана</h4>
            <label>Единицы температуры</label>
            <input type="text" placeholder="°C">
            <label>Частота обновления</label>
            <input type="text" placeholder="5 сек">
            <label>Тема</label>
            <input type="text" placeholder="Светлая">
        </div>

        <!-- Область контента (вкладки) -->
        <div class="content-area">
            <!-- Главная (с фотографией/схемой теплицы) -->
            <div id="tab-home" class="tab-content active">
                <div class="scene">
                    <!-- Здесь потом расставим горячие точки -->
                </div>
            </div>

            <!-- Аэропоника -->
            <div id="tab-aeroponics" class="tab-content">
                <div style="padding: 20px; color: #333;">
                    <h3>Аэропоника</h3>
                    <p>Управление аэропонной системой.</p>
                </div>
            </div>

            <!-- Гидропоника -->
            <div id="tab-hydroponics" class="tab-content">
                <div style="padding: 20px; color: #333;">
                    <h3>Гидропоника</h3>
                    <p>Управление гидропонной системой.</p>
                </div>
            </div>

            <!-- Датчики -->
            <div id="tab-sensors" class="tab-content">
                <div style="padding: 20px; color: #333;">
                    <h3>Датчики</h3>
                    <p>Показания всех датчиков.</p>
                </div>
            </div>
        </div>

        <!-- Три кнопки управления -->
        <div class="control-buttons">
            <div class="ctrl-btn" id="playBtn"><img src="icons/play.png" alt="Play"></div>
            <div class="ctrl-btn" id="pauseBtn"><img src="icons/pause.png" alt="Pause"></div>
            <div class="ctrl-btn" id="warningBtn"><img src="icons/warning.png" alt="Warning"></div>
        </div>

        <!-- Нижняя панель навигации -->
        <div class="bottom-nav">
            <div class="nav-btn active" data-tab="home">
                <img src="icons/home.svg" alt="Главная"><span>Главная</span>
            </div>
            <div class="nav-btn" data-tab="aeroponics">
                <img src="icons/aeroponics.svg" alt="Аэропоника"><span>Аэропоника</span>
            </div>
            <div class="nav-btn" data-tab="hydroponics">
                <img src="icons/hydroponics.svg" alt="Гидропоника"><span>Гидропоника</span>
            </div>
            <div class="nav-btn" data-tab="sensors">
                <img src="icons/sensors.svg" alt="Датчики"><span>Датчики</span>
            </div>
        </div>
    </div>

    <!-- Временный JavaScript для переключения вкладок и бургера -->
    <script>
        (function() {
            var navButtons = document.querySelectorAll('.nav-btn');
            var tabs = document.querySelectorAll('.tab-content');

            navButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    navButtons.forEach(function(b) { b.classList.remove('active'); });
                    tabs.forEach(function(t) { t.classList.remove('active'); });

                    var targetId = this.getAttribute('data-tab');
                    var targetTab = document.getElementById('tab-' + targetId);
                    if (targetTab) {
                        targetTab.classList.add('active');
                        this.classList.add('active');
                    }
                });
            });

            var burgerBtn = document.getElementById('burgerBtn');
            var sidePanel = document.getElementById('sidePanel');
            var closePanelBtn = document.getElementById('closePanelBtn');

            burgerBtn.addEventListener('click', function() { sidePanel.classList.add('open'); });
            closePanelBtn.addEventListener('click', function() { sidePanel.classList.remove('open'); });
            document.addEventListener('click', function(e) {
                if (!sidePanel.contains(e.target) && e.target !== burgerBtn) {
                    sidePanel.classList.remove('open');
                }
            });
        })();
    </script>
</body>
</html>
